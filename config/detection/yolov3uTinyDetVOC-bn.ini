; ============================================================
; 检测网络配置模板 (Detection Network Config Template)
; 根据 lib/detector/utils.hpp 中的 parser_ini_det_net_config 函数生成
; ============================================================
; 注释说明:
;   - 以 ';' 或 '#' 开头的行是注释行
;   - 数组格式: {元素1, 元素2, 元素3}
;   - 字符串数组: {'类别1', '类别2', '类别3'}
;   - 二维数组: {{1,2}, {3,4}, {5,6}}
; ============================================================

[detection]

; ------------------------------------------------------------
; 1. 模型名称 (必填)
;    用于标识模型功能, 例如: yolov5s-face, fireSmoke, yolo11n-pose
; ------------------------------------------------------------
model_name = yolov3uTinyDetVOC-bn

; ------------------------------------------------------------
; 2. 模型类型 (必填)
;    可选值: yolov3, yolov4, yolov5, yolov3u, yolov5u, yolov6u, yolov7u,
;            yolov8, yolov9, yolov10, yolo11, yolo12, yolo26
;    注意: yolov5 是 anchor-base 模型, 必须配置 anchors;
;          yolov3u/yolov5u/yolov6u/yolov7u/yolov8/yolov9/yolo11/yolo12 是 anchor-free 模型, 不需要 anchors
;          yolov10/yolo26 是端到端模型(anchor-free), 不需要 anchors, 不需要 NMS
;          yolov5u 是 anchor-free 模型, 不需要 anchors
; ------------------------------------------------------------
model_type = yolov3u

; ------------------------------------------------------------
; 3. 任务类型 (必填)
;    可选值: classification, detection, segmentation, pose, obb
; ------------------------------------------------------------
task = detection

; ------------------------------------------------------------
; 4. 是否包含置信度 (可选, 默认: false)
;    yolov5-face 等 anchor-base 模型需要置信度, 设为 true
;    yolov8 / yolo11 / yolo26 等 anchor-free 模型不需要, 设为 false
; ------------------------------------------------------------
has_conf = false

; ------------------------------------------------------------
; 5. 类别名称列表 (必填)
;    字符串数组, 每个类别对应一个名称
; ------------------------------------------------------------
names = { "aeroplane", "bicycle", "bird", "boat", "bottle", "bus", "car", "cat", "chair", "cow", "diningtable", "dog", "horse", "motorbike", "person", "pottedplant", "sheep", "sofa", "train", "tvmonitor" }

; ------------------------------------------------------------
; 6. 反量化系数 (必填)
;    用于量化模型的输出反量化, 每个输出层对应一个系数
;    非量化模型通常设为 {1.0, 1.0, 1.0}
; ------------------------------------------------------------
scale_outputs = {1.0, 1.0}

; ------------------------------------------------------------
; 7. 置信度阈值 (可选, 默认: {0.3})
;    每个类别可以设置不同的阈值, 如果个数小于类别数,
;    则使用最后一个值填充剩余类别
; ------------------------------------------------------------
conf_thrs = {0.4}

; ------------------------------------------------------------
; 8. NMS 的 IoU 阈值 (可选, 默认: 0.45)
; ------------------------------------------------------------
iou_thrs = 0.45

; ------------------------------------------------------------
; 9. 每张图片最大检测目标数 (可选, 默认: 300)
; ------------------------------------------------------------
max_det = 300

; ------------------------------------------------------------
; 10. 是否进行类别无关的 NMS (可选, 默认: false)
;     false: 不同类别之间不会进行 NMS (类别相关 NMS)
;     true:  所有类别一起进行 NMS (类别无关 NMS)
; ------------------------------------------------------------
agnostic = false

; ------------------------------------------------------------
; 11. Batch Size (可选, 默认: 1)
; ------------------------------------------------------------
batch_size = 1

; ------------------------------------------------------------
; 12. 关键点数量 (可选, 默认: 0)
;     仅 pose 任务需要设置, detection 任务设为 0
; ------------------------------------------------------------
kpt_count = 0

; ------------------------------------------------------------
; 13. 关键点维度 (可选, 默认: 0)
;     通常为 3 (x, y, confidence), 仅 pose 任务需要设置
;     yolov5-face 是 2 (x, y)
; ------------------------------------------------------------
kpt_dim = 0

; ------------------------------------------------------------
; 14. 输入图像尺寸 (必填)
;     格式: {channels, height, width}
;     例如: {3, 384, 640} 表示 3 通道, 384x640 输高宽
; ------------------------------------------------------------
input_chw = {3, 384, 640}

; ------------------------------------------------------------
; 15. 各输出层的步长 (必填)
;     每个输出层对应一个步长, 用于计算特征图尺寸
;     特征图尺寸 = input_size / stride
; ------------------------------------------------------------
strides = {16, 32}

; ------------------------------------------------------------
; 16. Anchor 信息 (anchor-base 模型必填, anchor-free 模型留空)
;     二维数组, 每个输出层对应一组 anchor
;     格式: {{w1,h1,w2,h2,...}, {w1,h1,w2,h2,...}, ...}
;     每个输出层的 anchor 数量 = 该层 anchor 元素个数 / 2
;
;     示例 (yolov5s 的 anchors):
;       {{10,13, 16,30, 33,23}, {30,61, 62,45, 59,119}, {116,90, 156,198, 373,326}}
;
;     注意: 如果 model_type = yolov5 且 anchors 为空, 会报错
; ------------------------------------------------------------
anchors = {}
