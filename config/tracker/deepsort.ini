; ============================================================
; DeepSORT 跟踪器配置文件 (DeepSORT Tracker Config)
; 根据 lib/tracker/TrackerConfig.hpp 中的 parser_ini_tracker_config 函数解析
; ============================================================
; 注释说明:
;   - 以 ';' 或 '#' 开头的行是注释行
;   - 数组格式: {元素1, 元素2, 元素3}
; ============================================================

[track]

; ------------------------------------------------------------
; 跟踪器类型 (必填)
;    可选值: sort, deepsort, bytetrack, ocsort
;    不区分大小写, 会自动转为小写匹配
; ------------------------------------------------------------
tracker_type = deepsort

; ------------------------------------------------------------
; 视频帧率 (可选, 默认: 30)
;    DeepSORT 中暂未直接用于 max_time_lost 计算,
;    保留以备后续扩展; 建议与实际摄像头帧率一致;
; ------------------------------------------------------------
frame_rate = 30

; ------------------------------------------------------------
; 轨迹保留帧缓冲数 (可选, 默认: 30)
;    DeepSORT 使用 max_age 控制轨迹最大丢失帧数,
;    此参数保留备用;
; ------------------------------------------------------------
track_buffer = 30

; ------------------------------------------------------------
; 检测框置信度阈值 (可选, 默认: 0.5)
;    低于此置信度的检测框会被过滤, 不送入跟踪器;
;    DeepSORT 不区分高分/低分检测框, 只做单次过滤;
; ------------------------------------------------------------
track_thresh = 0.5

; ------------------------------------------------------------
; 高分检测框阈值 (可选, 默认: 0.6)
;    ByteTrack 专用参数; DeepSORT 不使用此阈值,
;    保留为默认值 0.6 即可;
; ------------------------------------------------------------
high_thresh = 0.6

; ------------------------------------------------------------
; IoU 关联匹配阈值 (可选, 默认: 0.8)
;    DeepSORT 级联匹配阶段使用 IoU 代价矩阵时的上限阈值;
;    同时也用于 IOU 匹配阶段 (未匹配轨迹 vs 未匹配检测);
;    数值越大, 匹配越宽松; 典型值: 0.7 ~ 0.9;
; ------------------------------------------------------------
match_thresh = 0.8

; ------------------------------------------------------------
; 轨迹最大丢失帧数 (可选, 默认: 30)
;    超过此帧数仍未匹配到检测框的 Tentative/Confirmed 轨迹将被删除;
;    对应 DeepSORT 中的 max_age 参数;
;    帧率较高时可适当增大此值, 确保目标被遮挡时不会过早删除;
; ------------------------------------------------------------
max_age = 30

; ------------------------------------------------------------
; 新轨迹确认所需初始帧数 (可选, 默认: 3)
;    新创建的轨迹状态为 Tentative, 连续匹配 n_init 帧后转为 Confirmed;
;    n_init 越小, 轨迹越容易被确认 (但误检率也越高);
;    典型值: 3
; ------------------------------------------------------------
n_init = 3

; ------------------------------------------------------------
; IoU 匹配阈值 (可选, 默认: 0.7)
;    DeepSORT 中 IOU 兜底匹配阶段的阈值;
;    用于未匹配 Confirmed 轨迹 vs 未匹配检测的最后一轮匹配;
; ------------------------------------------------------------
max_iou_distance = 0.7

; ------------------------------------------------------------
; 是否使用 ReID 特征 (可选, 默认: true)
;    DeepSORT 核心特性: 使用外观特征 (ReID) 进行级联匹配;
;    设为 true 时需提供 reid_feature_dim 和 ReID 模型提取的特征;
;    设为 false 时退化为纯 IoU 匹配 (类似 SORT);
; ------------------------------------------------------------
use_reid = true

; ------------------------------------------------------------
; ReID 特征维度 (可选, 默认: 512)
;    ReID 网络输出的特征向量维度;
;    常见值: 128 (轻量模型), 256, 512 (标准模型);
;    必须与实际 ReID 网络输出维度一致, 否则运行时出错;
; ------------------------------------------------------------
reid_feature_dim = 512

; ------------------------------------------------------------
; 余弦距离阈值 (可选, 默认: 0.2)
;    DeepSORT 级联匹配中 NNMetric (近邻特征库) 的余弦距离上限;
;    距离 < max_cosine_distance : 认为是同一目标;
;    距离 >= max_cosine_distance: 认为外观不匹配, 不关联;
;    数值越小, 外观匹配越严格; 典型值: 0.2 ~ 0.4;
; ------------------------------------------------------------
max_cosine_distance = 0.2

; ------------------------------------------------------------
; 边界框扩展率 (可选, 默认: 0.0)
;    卡尔曼操作前将检测框向外扩展的比例;
;    扩展后的框用于卡尔曼的 initiate/update,
;    写回 ltwh 时自动恢复原始坐标;
;    对小目标跟踪有帮助, 典型值: 0.1 ~ 0.3;
;    设为 0.0 表示不扩展;
; ------------------------------------------------------------
expand_box_rate = 0.0

; ------------------------------------------------------------
; 第二次关联阈值 (可选, 默认: 0.5)
;    ByteTrack 专用参数; DeepSORT 不使用;
;    保留为默认值 0.5 即可;
; ------------------------------------------------------------
match_thresh_low = 0.5

; ------------------------------------------------------------
; 未确认轨迹匹配阈值 (可选, 默认: 0.7)
;    ByteTrack 专用参数; DeepSORT 不使用;
;    保留为默认值 0.7 即可;
; ------------------------------------------------------------
match_thresh_unconfirmed = 0.7

; ------------------------------------------------------------
; 余弦距离融合权重 (可选, 默认: 0.98)
;    DeepSORT 专用: 级联匹配中余弦距离的融合权重;
;    公式: combined = (1 - lambda) * 马氏距离 + lambda * 余弦距离;
;    lambda 越大, 越信任外观特征 (余弦距离), 马氏距离权重越低;
;    典型值: 0.98; 设为 1.0 表示完全信任 ReID 特征;
;    设为 0.0 退化为纯马氏距离匹配;
; ------------------------------------------------------------
lambda_cosine_weight = 0.98
