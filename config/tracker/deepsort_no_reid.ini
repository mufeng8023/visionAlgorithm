; ============================================================
; DeepSORT 跟踪器配置文件 (禁用 ReID 版本)
; ============================================================
; 本配置使用 DeepSORT 算法的纯几何匹配模式 (无 ReID 外观特征);
; 匹配策略: 马氏距离 (卡尔曼预测) + IoU 匹配兜底;
; 适用于: 无 ReID 模型、快速原型验证、行人等类别单一的场景;
; ============================================================

[track]

; ------------------------------------------------------------
; 跟踪器类型 (必填)
;    可选值: sort, deepsort, bytetrack, ocsort
;    不区分大小写
; ------------------------------------------------------------
tracker_type = deepsort

; ------------------------------------------------------------
; 视频帧率 (可选, 默认: 30)
;    用于计算轨迹最大丢失帧数:
;      max_time_lost = frame_rate / 30.0 * track_buffer
; ------------------------------------------------------------
frame_rate = 30

; ------------------------------------------------------------
; 轨迹保留帧缓冲数 (可选, 默认: 30)
;    配合 frame_rate 决定轨迹最大丢失帧数
; ------------------------------------------------------------
track_buffer = 30

; ------------------------------------------------------------
; 检测框置信度阈值 (可选, 默认: 0.5)
;    高于此阈值的检测框才能进入跟踪匹配流程
; ------------------------------------------------------------
track_thresh = 0.5

; ------------------------------------------------------------
; 高分检测框阈值 (可选, 默认: 0.6)
;    ByteTrack 专用, DeepSORT 中不生效
;    高于此阈值的检测框才允许用于创建新轨迹
; ------------------------------------------------------------
high_thresh = 0.6

; ------------------------------------------------------------
; 关联匹配阈值 (可选, 默认: 0.8)
;    用于匈牙利算法匹配时的 IoU 代价上限
; ------------------------------------------------------------
match_thresh = 0.8

; ------------------------------------------------------------
; 轨迹最大丢失帧数 (可选, 默认: 30)
;    超过此帧数未匹配的 Lost 轨迹将被标记为 Removed
; ------------------------------------------------------------
max_age = 30

; ------------------------------------------------------------
; 新轨迹确认所需最少匹配帧数 (可选, 默认: 3)
;    Tentative 状态轨迹连续匹配 n_init 帧后转为 Confirmed
; ------------------------------------------------------------
n_init = 3

; ------------------------------------------------------------
; IoU 匹配阈值 (可选, 默认: 0.7)
;    用于 IoU 二次匹配阶段
; ------------------------------------------------------------
max_iou_distance = 0.7

; ------------------------------------------------------------
; 边界框扩展率 (可选, 默认: 0.0)
;    卡尔曼操作前将检测框向外扩展的比例;
;    对小目标跟踪有帮助, 典型值: 0.1 ~ 0.3;
; ------------------------------------------------------------
expand_box_rate = 0.0

; ------------------------------------------------------------
; ByteTrack 第二次关联阈值 (可选, 默认: 0.5)
;    ByteTrack 专用, DeepSORT 中不生效
; ------------------------------------------------------------
match_thresh_low = 0.5

; ------------------------------------------------------------
; ByteTrack 第三次关联阈值 (可选, 默认: 0.7)
;    ByteTrack 专用, DeepSORT 中不生效
; ------------------------------------------------------------
match_thresh_unconfirmed = 0.7

; ------------------------------------------------------------
; 是否使用 ReID 特征 (DeepSORT 专用, 必填)
;    本配置禁用 ReID (use_reid = false)
;    true:  使用 ReID 外观特征进行级联匹配 (需要 reid 模型)
;    false: 纯马氏距离 + IoU 匹配 (不需要 reid 模型)
;
;    禁用 ReID 后, 以下参数不生效:
;      reid_feature_dim, max_cosine_distance, lambda_cosine_weight
; ------------------------------------------------------------
use_reid = false

; ------------------------------------------------------------
; ReID 特征向量维度 (DeepSORT 专用, 可选, 默认: 0)
;    本配置中不生效 (use_reid = false)
;    DeepSORT 通常为 512
; ------------------------------------------------------------
reid_feature_dim = 0

; ------------------------------------------------------------
; 余弦距离阈值 (DeepSORT 专用, 可选, 默认: 0.2)
;    本配置中不生效 (use_reid = false)
; ------------------------------------------------------------
max_cosine_distance = 0.2

; ------------------------------------------------------------
; 余弦距离融合权重 lambda (DeepSORT 专用, 可选, 默认: 0.98)
;    本配置中不生效 (use_reid = false)
;    公式: combined = (1 - lambda) * 马氏距离 + lambda * 余弦距离
; ------------------------------------------------------------
lambda_cosine_weight = 0.98