; ============================================================
; ByteTrack 跟踪器配置文件 (ByteTrack Tracker Config)
; 根据 lib/tracker/TrackerConfig.hpp 中的 parser_ini_tracker_config 函数解析
; ============================================================
; 注释说明:
;   - 以 ';' 或 '#' 开头的行是注释行
;   - 数组格式: {元素1, 元素2, 元素3}
; ============================================================

[track]

; ------------------------------------------------------------
; 跟踪器类型 (必填)
;    可选值: sort, deepsort, bytetrack, ocsort
;    不区分大小写, 会自动转为小写匹配
; ------------------------------------------------------------
tracker_type = bytetrack

; ------------------------------------------------------------
; 视频帧率 (可选, 默认: 30)
;    用于计算轨迹最大丢失帧数:
;       max_time_lost = frame_rate / 30.0 * track_buffer
; ------------------------------------------------------------
frame_rate = 30

; ------------------------------------------------------------
; 轨迹保留帧缓冲数 (可选, 默认: 30)
;    配合 frame_rate 决定轨迹最大丢失帧数
; ------------------------------------------------------------
track_buffer = 30

; ------------------------------------------------------------
; 检测框置信度阈值 (可选, 默认: 0.5)
;    高于此阈值的检测框被视为"高分检测框", 用于第一次关联
;    低于此阈值的检测框被视为"低分检测框", 用于第二次关联
; ------------------------------------------------------------
track_thresh = 0.5

; ------------------------------------------------------------
; 高分检测框阈值 (可选, 默认: 0.6)
;    ByteTrack 专用: 高于此阈值的检测框才允许用于创建新轨迹
;    在 Step 5 初始化新轨迹时, 只有 score >= high_thresh 的检测框
;    才会被激活为新轨迹
; ------------------------------------------------------------
high_thresh = 0.6

; ------------------------------------------------------------
; 关联匹配阈值 (可选, 默认: 0.8)
;    用于匈牙利算法匹配时的 IoU 代价上限
;    第一次关联使用此阈值, 第二次关联使用固定 0.5
; ------------------------------------------------------------
match_thresh = 0.8

; ------------------------------------------------------------
; 轨迹最大丢失帧数 (可选, 默认: 30)
;    超过此帧数仍未匹配到检测框的 Lost 轨迹将被标记为 Removed
; ------------------------------------------------------------
max_age = 30

; ------------------------------------------------------------
; 新轨迹确认所需初始帧数 (可选, 默认: 3)
;    新创建的轨迹状态为 New, 连续匹配 n_init 帧后自动转为 Tracked
; ------------------------------------------------------------
n_init = 3

; ------------------------------------------------------------
; IoU 匹配阈值 (可选, 默认: 0.7)
;    用于第二次关联阶段以及未确认(New状态)轨迹的匹配
; ------------------------------------------------------------
max_iou_distance = 0.7

; ------------------------------------------------------------
; 边界框扩展率 (可选, 默认: 0.0)
;     卡尔曼操作前将检测框向外扩展的比例;
;     扩展后的框用于卡尔曼的 initiate/update,
;     写回 ltwh 时自动恢复原始坐标;
;     对小目标跟踪有帮助, 典型值: 0.1 ~ 0.3;
;     设为 0.0 表示不扩展;
; ------------------------------------------------------------
expand_box_rate = 0.0

; ------------------------------------------------------------
; 第二次关联阈值 (可选, 默认: 0.5)
;     ByteTrack 专用: 低分检测框 vs 未匹配 Tracked 轨迹 的 IoU 代价上限;
;     应比 match_thresh 更宽松, 允许低分检测框的模糊匹配;
;     典型值: 0.5
; ------------------------------------------------------------
match_thresh_low = 0.5

; ------------------------------------------------------------
; 未确认轨迹匹配阈值 (可选, 默认: 0.7)
;     ByteTrack 专用: 未确认 (New状态) 轨迹 vs 剩余高分检测框 的 IoU 代价上限;
;     应比 match_thresh 更严格, 防止未确认轨迹错误匹配;
;     典型值: 0.7
; ------------------------------------------------------------
match_thresh_unconfirmed = 0.7

