pages:
    stage: deploy
    image: alpine:3.22.4
    before_script:
        # 核心修改：在 Alpine 容器中除了装 pandoc, 必须加装 bash 和 coreutils(提供标准 tr 支持)
        - apk add --no-cache pandoc bash coreutils
    script:
        - chmod +x scripts/build-pages.sh
        # 显式指定用 bash 运行脚本
        - bash scripts/build-pages.sh
    artifacts:
        paths:
            - public
    only:
        - gh-pages
