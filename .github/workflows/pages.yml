# GitHub Pages 部署工作流
# 触发条件: 推送到 gh-pages 分支时自动构建并部署
name: Deploy GitHub Pages

on:
    push:
        branches:
            - gh-pages

    # 允许手动触发
    workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以部署到 Pages
permissions:
    contents: read
    pages: write
    id-token: write

# 只允许一个并发部署, 避免旧部署覆盖新部署
concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install pandoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Build Pages
              run: |
                  # 显式赋予脚本执行权限
                  chmod +x scripts/build-pages-gh.sh
                  # 使用 bash 运行脚本，确保兼容 IFS、字符串拼接等高级 Shell 语法
                  bash scripts/build-pages-gh.sh

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # 这里的路径必须与你脚本中生成的静态文件输出目录一致
                  path: public

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
