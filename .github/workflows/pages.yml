name: GitHub Pages

on:
    push:
        branches:
            - gh-pages

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install pandoc
              run: sudo apt-get update && sudo apt-get install -y pandoc

            - name: Create CSS style
              run: |
                  mkdir -p public/css
                  cat > public/css/style.css << 'STYLE_EOF'
                  :root {
                      --bg-primary: #ffffff;
                      --bg-secondary: #f6f8fa;
                      --text-primary: #24292f;
                      --text-secondary: #57606a;
                      --border-color: #d0d7de;
                      --accent-color: #0969da;
                      --accent-hover: #0550ae;
                      --code-bg: #f6f8fa;
                      --blockquote-border: #d0d7de;
                      --table-header-bg: #f6f8fa;
                      --table-row-even: #f6f8fa;
                      --max-width: 960px;
                      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif;
                  }

                  * {
                      box-sizing: border-box;
                      margin: 0;
                      padding: 0;
                  }

                  body {
                      font-family: var(--font-sans);
                      font-size: 16px;
                      line-height: 1.7;
                      color: var(--text-primary);
                      background-color: var(--bg-primary);
                      padding: 0;
                      margin: 0;
                  }

                  /* 页面容器 - 居中且带左右留白 */
                  body > *:not(nav):not(.nav) {
                      max-width: var(--max-width);
                      margin-left: auto;
                      margin-right: auto;
                      padding-left: 24px;
                      padding-right: 24px;
                  }

                  /* 导航面包屑 */
                  nav, .nav {
                      max-width: var(--max-width);
                      margin: 0 auto;
                      padding: 16px 24px;
                      font-size: 14px;
                      color: var(--text-secondary);
                      border-bottom: 1px solid var(--border-color);
                      background: var(--bg-secondary);
                  }
                  nav a, .nav a {
                      color: var(--accent-color);
                      text-decoration: none;
                  }
                  nav a:hover, .nav a:hover {
                      text-decoration: underline;
                  }

                  /* 标题样式 */
                  h1, h2, h3, h4, h5, h6 {
                      margin-top: 24px;
                      margin-bottom: 16px;
                      font-weight: 600;
                      line-height: 1.25;
                      color: var(--text-primary);
                      padding-bottom: 0;
                  }
                  h1 {
                      font-size: 2em;
                      border-bottom: 1px solid var(--border-color);
                      padding-bottom: 8px;
                      margin-top: 0;
                      padding-top: 24px;
                  }
                  h2 {
                      font-size: 1.5em;
                      border-bottom: 1px solid var(--border-color);
                      padding-bottom: 6px;
                  }
                  h3 { font-size: 1.25em; }
                  h4 { font-size: 1em; }
                  h5 { font-size: 0.875em; }
                  h6 { font-size: 0.85em; color: var(--text-secondary); }

                  /* 段落与链接 */
                  p {
                      margin-top: 0;
                      margin-bottom: 16px;
                  }
                  a {
                      color: var(--accent-color);
                      text-decoration: none;
                  }
                  a:hover {
                      text-decoration: underline;
                      color: var(--accent-hover);
                  }

                  /* 代码 */
                  code {
                      font-family: var(--font-mono);
                      font-size: 85%;
                      padding: 2px 6px;
                      border-radius: 4px;
                      background-color: var(--code-bg);
                      color: #cf222e;
                  }
                  pre {
                      font-family: var(--font-mono);
                      font-size: 85%;
                      line-height: 1.5;
                      padding: 16px;
                      border-radius: 6px;
                      background-color: var(--code-bg);
                      border: 1px solid var(--border-color);
                      overflow-x: auto;
                      margin-bottom: 16px;
                  }
                  pre code {
                      padding: 0;
                      border: none;
                      background: none;
                      color: inherit;
                      font-size: inherit;
                  }

                  /* 代码块中的语法高亮(由 pandoc 生成的) */
                  span.kw { color: #cf222e; font-weight: bold; }
                  span.dt { color: #953800; }
                  span.dv { color: #0550ae; }
                  span.bn { color: #0550ae; }
                  span.fl { color: #0550ae; }
                  span.ch { color: #0a3069; }
                  span.st { color: #0a3069; }
                  span.co { color: #656d76; font-style: italic; }
                  span.ot { color: #57606a; }
                  span.al { color: #82071e; font-weight: bold; }
                  span.fu { color: #8250df; }
                  span.er { color: #cf222e; font-weight: bold; }
                  span.wa { color: #9a6700; font-weight: bold; }
                  span.cn { color: #0550ae; }
                  span.sc { color: #0a3069; }
                  span.vs { color: #0a3069; }
                  span.ss { color: #0a3069; }
                  span.im { color: #cf222e; }
                  span.va { color: #953800; }

                  /* 引用块 */
                  blockquote {
                      margin: 0 0 16px 0;
                      padding: 0 1em;
                      color: var(--text-secondary);
                      border-left: 4px solid var(--blockquote-border);
                  }
                  blockquote p {
                      margin-bottom: 8px;
                  }

                  /* 列表 */
                  ul, ol {
                      margin-top: 0;
                      margin-bottom: 16px;
                      padding-left: 2em;
                  }
                  li {
                      margin-top: 4px;
                  }
                  li > p {
                      margin-bottom: 8px;
                  }

                  /* 表格 */
                  table {
                      display: block;
                      width: 100%;
                      max-width: 100%;
                      overflow-x: auto;
                      border-collapse: collapse;
                      margin-bottom: 16px;
                      font-size: 14px;
                  }
                  th {
                      font-weight: 600;
                      background-color: var(--table-header-bg);
                      border: 1px solid var(--border-color);
                      padding: 8px 12px;
                      text-align: left;
                  }
                  td {
                      border: 1px solid var(--border-color);
                      padding: 8px 12px;
                  }
                  tr:nth-child(even) {
                      background-color: var(--table-row-even);
                  }

                  /* 水平分割线 */
                  hr {
                      height: 1px;
                      border: none;
                      background-color: var(--border-color);
                      margin: 24px 0;
                  }

                  /* 图片 */
                  img {
                      max-width: 100%;
                      height: auto;
                      border-radius: 4px;
                      margin: 8px 0;
                  }

                  /* 定义列表(用于INI配置) */
                  dl {
                      margin-bottom: 16px;
                  }
                  dt {
                      font-weight: 600;
                      margin-top: 8px;
                  }
                  dd {
                      margin-left: 24px;
                      margin-bottom: 4px;
                  }

                  /* 脚注 */
                  .footnotes {
                      margin-top: 32px;
                      font-size: 14px;
                      color: var(--text-secondary);
                      border-top: 1px solid var(--border-color);
                      padding-top: 16px;
                  }

                  /* 响应式调整 */
                  @media (max-width: 600px) {
                      body {
                          font-size: 15px;
                      }
                      body > *:not(nav):not(.nav) {
                          padding-left: 16px;
                          padding-right: 16px;
                      }
                      table {
                          font-size: 13px;
                      }
                  }
                  STYLE_EOF

            - name: Convert README.md to index.html
              run: |
                  pandoc README.md -f markdown -t html -s \
                    --metadata title="visionAlgorithm" \
                    --metadata lang="zh-CN" \
                    -c css/style.css \
                    -o public/index.html

            - name: Convert doc/*.md to HTML
              run: |
                  mkdir -p public/doc
                  for md_file in doc/*.md; do
                    base_name=$(basename "$md_file" .md)
                    pandoc "$md_file" -s \
                      --metadata title="${base_name}" \
                      --metadata lang="zh-CN" \
                      -c ../css/style.css \
                      -o "public/doc/${base_name}.html"
                  done

            - name: Fix internal links (.md -> .html)
              run: |
                  find public -name '*.html' -exec sed -i 's/\(href="[^"]*\)\.md"/\1.html"/g' {} +

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
