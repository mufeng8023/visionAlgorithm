# Node.js 20 将于 2026-09-16 从 runner 中移除, 届时需将 actions 升级至支持 Node.js 24 的版本;
# 参考: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
name: GitHub Pages

on:
    push:
        branches:
            - gh-pages

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: alpine:3.22.4
        steps:
            - uses: actions/checkout@v4

            - name: Install pandoc
              run: apk add --no-cache pandoc

            - name: Build pages with shared script
              run: sh scripts/build-pages.sh

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./public

    deploy:
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
