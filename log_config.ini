; ============================================
; 日志配置文件
; ============================================

[default]

; 默认日志文件名称
custom_log_name = default

; 日志文件存放路径，使用命令行参数中配置的根路径
; 默认值: ../logs
log_folder = ../logs

; 日志级别: Trace=0, Debug=1, Info=2, Warn=3, Error=4, Critical=5
log_level = 1

; 单个日志文件的最大大小（MB）
max_file_size_mb = 10

; 最多保留的日志文件数量
max_files = 5

; 是否启用控制台输出日志
enable_console = true

; 是否启用进程安全模式 (多进程环境下使用文件锁)
process_safe = false
